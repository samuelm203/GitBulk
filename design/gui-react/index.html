<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300a4e0'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='700' text-anchor='middle' fill='white'%3EGB%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GitBulk — Run Dashboard</title>
    <script>
      // Theme VOR dem ersten Paint setzen — verhindert ein Aufblitzen des
      // falschen Modus (FOUC). Quelle: gespeicherte Wahl, sonst System.
      (function () {
        try {
          var forced = new URLSearchParams(window.location.search).get('theme');
          var pref = forced === 'dark' || forced === 'light' ? forced : localStorage.getItem('gitbulk-theme');
          var dark = pref === 'dark' || (pref == null && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage nicht verfügbar — Standard (hell) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
